<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>双鱼助手 · 激活登录</title><link href="fonts/fonts.css" rel="stylesheet"><link href="css/activation.css" rel="stylesheet"></head>
<body>
<header><span>双鱼部落写作业机器人</span><div><button id="minimize" aria-label="最小化">−</button><button id="close" aria-label="关闭">×</button></div></header>
<main><section class="activation-card"><div class="brand">双鱼助手</div><h1>激活码登录</h1><p class="intro">请输入激活码，激活后即可使用软件。</p>
<form id="activationForm"><label for="activationCode">激活码</label><textarea id="activationCode" rows="4" maxlength="4096" autocomplete="off" spellcheck="false" placeholder="粘贴完整激活码" required></textarea><button id="activateBtn" type="submit">激活并进入</button></form>
<div id="activationError" role="alert" aria-live="polite"></div><button id="retryBtn" class="secondary" type="button">重新检查授权</button>
<p class="details">默认首次成功激活后有效七天，以激活码指定时长为准。期限内再次打开自动进入；到期后需要新激活码。</p><p id="expiryInfo"></p></section></main><script src="js/activation.js"></script></body></html>
